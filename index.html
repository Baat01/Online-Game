<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- SEO -->
    <title>ENGEI 宴芸 — Cercle Bami · Jeux de Table &amp; Paris</title>
    <meta
      name="description"
      content="ENGEI (宴芸) — Le cercle souterrain de jeux de table et de paris de l'Académie, sous l'égide des clans Bami et de la Banque des 6 Lances."
    />
    <meta name="theme-color" content="#0a0a0e" />

    <!-- Open Graph -->
    <meta property="og:title" content="ENGEI 宴芸 — Cercle Bami" />
    <meta
      property="og:description"
      content="Affrontez vos rivaux en temps réel à Blackjack, Saving Throw, Blackjack Twist et Four Seasons."
    />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- GitHub Pages SPA redirect decoder (pairs with public/404.html) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
